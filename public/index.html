<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loopOut- Premium Moderation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Content Moderation Dashboard</h1>
    <div class="card glass">
      <h2>Image Moderation</h2>
      <input type="url" id="imageUrl" placeholder="Enter image URL" />
      <button id="moderateImageBtn">Check Image</button>
    </div>
    <div class="card glass">
      <h2>Text / Profile Moderation</h2>
      <textarea id="textInput" rows="4" placeholder="Enter text or profile description"></textarea>
      <button id="moderateTextBtn">Check Text</button>
    </div>
    <div id="result" class="card glass hidden"></div>
  </div>
<section class="used-items-section">
  <h2>Used Items Marketplace</h2>
  <div class="cards-grid">
    <div class="card glass">
      <h3>📚 Books</h3>
      <p>Second‑hand books at great prices.</p>
      <a href="#" class="button">Visit Shop</a>
    </div>
    <div class="card glass">
      <h3>👟 Sneaker Cleaner</h3>
      <p>Used sneaker cleaning kits.</p>
      <a href="#" class="button">Visit Shop</a>
    </div>
    <div class="card glass">
      <h3>📸 Photography Gear</h3>
      <p>Pre‑owned cameras and lenses.</p>
      <a href="#" class="button">Visit Shop</a>
    </div>
  </div>
</section>
  <script src="moderation.js"></script>
</body>
</html>
