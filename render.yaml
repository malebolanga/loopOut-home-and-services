services:
  - type: web
    name: loupeout-home
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: MONGO
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      # Required to validate Google ID tokens sent by the web and iOS clients.
      # Set this to the complete one-line Firebase service-account JSON in Render.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Public URL of this API (used to build callback URLs).
      - key: BACKEND_URL
        sync: false
      # Extra browser origins allowed to call the API, comma-separated (optional).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # AI help / listing assistant / image & text moderation.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # SMS notifications (optional).
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_NUMBER
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
