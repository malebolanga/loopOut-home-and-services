<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGradientIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E61E4D" />
      <stop offset="100%" stop-color="#D70466" />
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="logoGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#FF385C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)" filter="url(#logoGlowIcon)">
    <!-- Base outer O-Ring -->
    <circle cx="100" cy="100" r="42" fill="rgba(255, 56, 92, 0.02)" stroke="url(#brandGradientIcon)" stroke-width="13.5"/>
    
    <!-- Internal glowing loops -->
    <path d="M 100 100 C 77 66, 138 83, 100 127" stroke="url(#brandGradientIcon)" stroke-width="6.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M 76 100 C 76 80, 113 80, 113 100 C 113 120, 76 120, 76 100" stroke="#FF7A8F" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Handle (pointed top-left) -->
    <path d="M 70 70 L 30 30" stroke="url(#brandGradientIcon)" stroke-width="16.5" stroke-linecap="round"/>
    
    <!-- Inner Lens shine reflection -->
    <circle cx="86" cy="86" r="8" fill="white" opacity="0.25"/>
  </g>
</svg>
