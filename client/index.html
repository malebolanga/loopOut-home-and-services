<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .scroll-container {
    overflow-y: auto;

  }

  html {
    scroll-behavior: smooth;
  }

  :root {
    /* Default Theme */
    --primary-color: #4a5568;
    --secondary-color: #718096;
    --background-color: #f0f2f5;
    --text-color: #2d3748;
    --header-bg: rgba(247, 245, 245, 0.9);
  }

  [data-theme="duck"] {
    --primary-color: #ffd700;
    --secondary-color: #ffaa00;
    --background-color: #fff9e6;
    --text-color: #2d3748;
    --header-bg: rgba(255, 249, 230, 0.9);
  }

  [data-theme="white"] {
    --primary-color: #e2e8f0;
    --secondary-color: #cbd5e0;
    --background-color: #ffffff;
    --text-color: #1a202c;
    --header-bg: rgba(255, 255, 255, 0.9);
  }

  body {
    background-color: var(--background-color);
    color: var(--text-color);
    transition: background-color 0.3s ease;
  }

  header {
     background-color: var(--background-color);
  }

  /* Rest of your existing styles... */

/* Apply padding to all pages except home page */
body:not(.home-page) {
  padding-top: 0px;
}

  link {
    mix-blend-mode: color-burn;
    border-radius: 50%;
    background-size: cover;


  }

  .flex-child {
    flex-shrink: 1;
    /* Allow shrinking */
    min-width: 0;
    /* Fixes flex item overflow */
  }

  .text-container {
    overflow-wrap: break-word;
    word-break: break-word;

  }

  .parent-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .content-area {
    flex: 1;
    /* Takes remaining space */
    min-height: 0;
    /* Fixes Chrome flex overflow bug */
  }

  .app-container {
    overflow: hidden;
    /* Hide overflow */
    /* OR */
    overflow: auto;
    /* Add scrollbars when needed */
    min-height: 100vh;
    /* Full viewport height */
    width: 100%;
    box-sizing: border-box;
    /* Include padding in width calculation */
  }

  .app-grid {
    display: grid;
    grid-template-rows: auto 1fr auto;
    /* Header, content, footer */
    min-height: 100vh;
  }

  img,
  video,
  iframe {
    max-width: 100%;
    height: auto;
    object-fit: contain;
  }

  .grid-item {
    min-width: 0;
    overflow: hidden;
  }

  .section {
    height: 100vh;
    height: 100dvh;
    /* Mobile-friendly */
    max-height: -webkit-fill-available;
  }

  .flex-parent {
    display: flex;
    min-width: 0;
  }

  .flex-child {
    flex: 1;
    min-width: 0;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }



  header {
    position: fixed;
    /* Makes the header fixed */
    top: 0;
    /* Positions it at the top */
    left: 0;
    /* Positions it at the left */
    right: 0;
    /* Positions it at the right */
    z-index: 50;
    /* Keeps the header above other content */
     background-color: var(--background-color);
    /* Optional: slightly transparent */
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 10px;
  }

  .scrollbar-hide::-webkit-scrollbar {
    display: none;
  }
  .scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
